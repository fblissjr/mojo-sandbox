[workspace]
authors = ["fbjr"]
channels = [
    "https://conda.modular.com/max-nightly/",
    "https://conda.modular.com/max/",
    "conda-forge",
]
name = "mojo-sandbox"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"
description = "Mojo 1.0 beta hands-on sandbox: SIMD, GPU kernels, small-model inference."

# Pin Mojo to a specific 1.0 beta during the beta — nightly drifts daily.
# Bump deliberately when crossing a release.
[dependencies]
modular = ">=26.3,<26.4"
python = ">=3.12,<3.13"

[tasks]
versions = { cmd = "mojo --version && pixi --version", description = "Print Mojo + pixi versions to confirm install." }

# ---- 00-setup ---------------------------------------------------------------
[tasks.hello-kernel]
cmd = "mojo run hello_kernel.mojo"
cwd = "00-setup"
description = "Run the workspace smoke-test kernel (vector add) on the local GPU backend."

[tasks.hello-test]
cmd = "mojo run test_smoke.mojo"
cwd = "00-setup"
description = "Run the smoke-test file (Mojo 1.0 removed `mojo test`; tests are scripts)."

# ---- 01-tokenizer -----------------------------------------------------------
[tasks.tokenizer-build]
cmd = "mkdir -p build && mojo build --emit shared-lib src/mojo_tokenizer.mojo -o build/mojo_tokenizer.so"
cwd = "01-tokenizer"
description = "Compile mojo_tokenizer to a Python extension .so."

[tasks.tokenizer-bench]
cmd = "python bench/bench.py"
cwd = "01-tokenizer"
depends-on = ["tokenizer-build"]
description = "Run the Phase A smoke + microbench against the built .so."

[tasks.tokenizer]
depends-on = ["tokenizer-bench"]
description = "Build + bench (Phase A)."
